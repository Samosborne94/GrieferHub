<!-- @dsCard group="Components" name="Badges & Pills" -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin:20px 0 10px}
h2:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;border-radius:999px;font-weight:500;padding:2px 10px;font-size:12px;border:1px solid}
.lg{padding:4px 12px;font-size:14px}
.sev{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;border:1px solid;font-size:12px;font-weight:600}
.tag{padding:4px 12px;border-radius:999px;font-size:12px;background:#252525;color:#666;border:1px solid rgba(255,255,255,.05)}
</style>
<h2>Status badges</h2>
<div class="row">
  <span class="badge" style="background:rgba(34,197,94,.2);border-color:#22c55e;color:#22c55e">Verified</span>
  <span class="badge" style="background:rgba(234,179,8,.2);border-color:#eab308;color:#eab308">Under Review</span>
  <span class="badge" style="background:rgba(59,130,246,.2);border-color:#3b82f6;color:#3b82f6">Resolved</span>
  <span class="badge" style="background:rgba(239,68,68,.2);border-color:#ef4444;color:#ef4444">Rejected</span>
  <span class="badge lg" style="background:rgba(34,197,94,.2);border-color:#22c55e;color:#22c55e">Verified · lg</span>
</div>
<h2>Severity pills</h2>
<div class="row">
  <span class="sev" style="background:rgba(107,114,128,.1);border-color:rgba(107,114,128,.3);color:#9ca3af">● Low</span>
  <span class="sev" style="background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#f59e0b">●● Medium</span>
  <span class="sev" style="background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.3);color:#f97316">●●● High</span>
  <span class="sev" style="background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.3);color:#ef4444">●●●● Critical</span>
</div>
<h2>Tags</h2>
<div class="row">
  <span class="tag">stream-sniping</span>
  <span class="tag">base-raiding</span>
  <span class="tag">hacking</span>
  <span class="tag" style="border:0;background:none">+2 more</span>
</div>
