<!-- @dsCard group="Components" name="Report Card (current)" -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;max-width:440px}
.card{position:relative;overflow:hidden;border-radius:12px;padding:24px;background:rgba(20,20,20,.6);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .25s}
.card:hover{background:rgba(30,30,30,.7);border-color:rgba(255,68,68,.3);transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(0,0,0,.5),0 0 20px rgba(255,68,68,.15)}
.bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(220,38,38,.4);transition:width .3s}
.card:hover .bar{width:6px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
h3{font-size:18px;font-weight:700}
.card:hover h3{color:#ff4444}
.meta{font-size:13px;color:#666;margin-top:2px}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:rgba(234,179,8,.2);border:1px solid #eab308;color:#eab308;white-space:nowrap}
.desc{font-size:14px;color:#a0a0a0;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tag{padding:3px 12px;border-radius:999px;font-size:11px;background:#252525;color:#666;border:1px solid rgba(255,255,255,.05)}
.ft{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid rgba(255,255,255,.05)}
.sev{display:inline-flex;gap:8px;align-items:center;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:#ef4444}
.date{font-size:11px;color:#666}
</style>
<article class="card">
  <div class="bar"></div>
  <div class="hd">
    <div><h3>xX_Destroyer_Xx</h3><div class="meta">Minecraft · Hypixel SMP</div></div>
    <span class="badge">Under Review</span>
  </div>
  <p class="desc">Systematically dismantled three community builds over two nights using duped TNT, then flooded spawn with lava. Multiple witnesses with video evidence.</p>
  <div class="tags"><span class="tag">tnt-griefing</span><span class="tag">duping</span><span class="tag">spawn-attack</span></div>
  <div class="ft">
    <span class="sev">●●●● Critical</span>
    <span class="date">📅 Jul 12, 2026</span>
  </div>
</article>
