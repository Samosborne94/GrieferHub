<!-- @dsCard group="Components" name="Empty & Loading States" -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:10px;grid-column:span 2}
.empty{grid-column:span 2;text-align:center;padding:48px 24px;border:1px dashed rgba(255,255,255,.1);border-radius:12px;background:#141414}
.empty .ico{font-size:40px;margin-bottom:12px}
.empty h3{font-size:18px;font-weight:700;margin-bottom:6px}
.empty p{font-size:14px;color:#a0a0a0;max-width:340px;margin:0 auto 18px}
.cta{display:inline-block;padding:10px 20px;border-radius:8px;background:#ff4444;color:#fff;font-weight:500;text-decoration:none;font-size:14px}
.cta:hover{background:#ff5555}
.skel{border-radius:12px;padding:24px;background:#141414;border:1px solid rgba(255,255,255,.05)}
.b{border-radius:6px;background:linear-gradient(90deg,#1e1e1e 25%,#2a2a2a 50%,#1e1e1e 75%);background-size:200% 100%;animation:sh 1.5s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinwrap{display:flex;align-items:center;justify-content:center;gap:12px;padding:24px;border-radius:12px;background:#141414;border:1px solid rgba(255,255,255,.05);color:#666;font-size:13px}
.spin{width:22px;height:22px;border:3px solid #2a2a2a;border-top-color:#ff4444;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
<h2>Empty state</h2>
<div class="empty">
  <div class="ico">🔍</div>
  <h3>No reports found</h3>
  <p>No griefers match your filters. Try widening the search — or be the first to report one.</p>
  <a class="cta" href="#">Submit a Report</a>
</div>
<h2>Loading</h2>
<div class="skel">
  <div class="b" style="height:20px;width:60%;margin-bottom:10px"></div>
  <div class="b" style="height:12px;width:40%;margin-bottom:16px"></div>
  <div class="b" style="height:12px;width:100%;margin-bottom:6px"></div>
  <div class="b" style="height:12px;width:85%"></div>
</div>
<div class="spinwrap"><span class="spin"></span>Loading intel…</div>
