<!-- @dsCard group="Components" name="Buttons" -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin:20px 0 10px}
h2:first-child{margin-top:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;border-radius:8px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;font-family:inherit}
.md{padding:8px 16px;font-size:16px}.sm{padding:6px 12px;font-size:14px}.lg{padding:12px 24px;font-size:18px}
.primary{background:#ff4444;color:#fff}.primary:hover{background:#ff5555;box-shadow:0 0 20px rgba(255,68,68,.3)}
.secondary{background:#1e1e1e;color:#fff;border:1px solid #374151}.secondary:hover{background:#141414}
.danger{background:#dc2626;color:#fff}.danger:hover{background:#b91c1c}
.ghost{background:transparent;color:#fff}.ghost:hover{background:#1e1e1e}
.off{opacity:.5;cursor:not-allowed}
.spin{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
<h2>Variants</h2>
<div class="row">
  <button class="btn primary md">Submit Report</button>
  <button class="btn secondary md">View Details</button>
  <button class="btn danger md">Delete</button>
  <button class="btn ghost md">Cancel</button>
</div>
<h2>Sizes</h2>
<div class="row">
  <button class="btn primary sm">Small</button>
  <button class="btn primary md">Medium</button>
  <button class="btn primary lg">Large</button>
</div>
<h2>States</h2>
<div class="row">
  <button class="btn primary md"><span class="spin"></span>Uploading…</button>
  <button class="btn primary md off" disabled>Disabled</button>
  <button class="btn secondary md off" disabled>Disabled</button>
</div>
