<!-- @dsCard group="Proposals" name="Intel Board Hero — search-first" -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.hero{position:relative;padding:72px 24px 56px;text-align:center;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,68,68,.12),transparent)}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 30%,transparent 75%)}
.inner{position:relative;max-width:640px;margin:0 auto}
.ticker{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.25);font-size:12px;color:#ff6b6b;margin-bottom:22px}
.pulse{width:7px;height:7px;border-radius:50%;background:#ff4444;animation:p 2s infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.5)}50%{box-shadow:0 0 0 6px rgba(255,68,68,0)}}
h1{font-size:52px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.grad{background:linear-gradient(135deg,#ff4444,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:17px;color:#a0a0a0;margin-bottom:30px}
.search{display:flex;align-items:center;gap:10px;background:rgba(30,30,30,.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 6px 6px 18px;box-shadow:0 20px 25px -5px rgba(0,0,0,.6)}
.search:focus-within{border-color:rgba(255,68,68,.5);box-shadow:0 0 0 3px rgba(255,68,68,.12),0 20px 25px -5px rgba(0,0,0,.6)}
.search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:15px;font-family:inherit}
.search input::placeholder{color:#4a4a4a}
.search button{padding:11px 22px;border-radius:10px;border:0;background:#ff4444;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.search button:hover{background:#ff5555}
.hints{margin-top:14px;font-size:12px;color:#4a4a4a}
.hints b{color:#666;font-weight:500}
.stats{display:flex;justify-content:center;gap:36px;margin-top:36px;font-size:13px;color:#666}
.stats b{display:block;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.02em}
.stats .g{color:#10b981}
</style>
<section class="hero">
  <div class="grid-bg"></div>
  <div class="inner">
    <span class="ticker"><span class="pulse"></span>3 new reports verified in the last hour</span>
    <h1>Know who you're<br/><span class="grad">letting on your server</span></h1>
    <p class="sub">Search 1,200+ community-verified griefer reports before they strike twice.</p>
    <div class="search">
      <span style="color:#4a4a4a">🔎</span>
      <input placeholder="Search by player name, server, or game…" />
      <button>Search Intel</button>
    </div>
    <div class="hints">Try: <b>xX_Destroyer_Xx</b> · <b>Hypixel</b> · <b>tnt-griefing</b> — or press <b>/</b> to focus</div>
    <div class="stats">
      <span><b>1,284</b>reports</span>
      <span><b class="g">947</b>verified</span>
      <span><b>36</b>games covered</span>
    </div>
  </div>
</section>
